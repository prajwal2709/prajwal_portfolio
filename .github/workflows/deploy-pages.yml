name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare GitHub Pages site
        run: |
          mkdir _site
          cp -R site/. _site/
          node <<'NODE'
          const fs = require('node:fs');
          const path = '_site/index.html';
          let html = fs.readFileSync(path, 'utf8');
          html = html.replaceAll(
            'https://prajwal-portfolio.pd613868.workers.dev/',
            'https://prajwal2709.github.io/prajwal_portfolio/'
          );
          html = html.replaceAll(
            'https://prajwal-portfolio.pd613868.workers.dev/social-preview.png',
            'https://prajwal2709.github.io/prajwal_portfolio/social-preview.png'
          );
          fs.writeFileSync(path, html);
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
